: "S22", "name": "TFO · YouTube", "title": "Ma vie avec l’IA · L’IA est-elle vraiment intelligente ?", "date": "Consulté le 18 septembre 2026", "url": "https://www.youtube.com/watch?v=Q4y5mxy5HWQ", "note": "Publication officielle TFO. Média de remplacement pour les pages Lumni non intégrables ; lecture du flux à vérifier sur le réseau utilisé."}, {"id": "S23", "name": "TFO · YouTube", "title": "Ma vie avec l’IA · Peut-on faire confiance à l’IA ?", "date": "Consulté le 18 septembre 2026", "url": "https://www.youtube.com/watch?v=5UvLW5AaTS0", "note": "Même série, publication sur le canal TFO ; utilisation du lecteur YouTube."}], "modules": [{"id": "m0", "name": "Comprendre l’IA", "verb": "Expliquer le fonctionnement", "color": "purple", "symbol": "01", "title": "Derrière la réponse, comment ça marche ?", "intro": "Avant d’examiner les conséquences, découvre ce qu’un modèle apprend et ce qu’il produit lorsque tu lui écris.", "easy": "Une IA générative produit du contenu à partir de régularités apprises. Une phrase bien écrite peut pourtant être fausse.", "docTitle": "", "docKind": "", "doc": "", "questions": [{"id": "m0q1", "type": "single", "title": "Apprendre puis produire", "prompt": "Quelle description distingue le mieux l’entraînement d’un modèle de langage et son utilisation ?", "options": ["Pendant l’entraînement, le modèle est ajusté sur des exemples ; pendant l’utilisation, il produit une réponse en tenant compte de la demande.", "Chaque question entraîne de nouveau tout le modèle depuis le début.", "Le modèle recopie nécessairement une page entière choisie par une personne en direct."], "correct": 0, "hint": "Distingue ce qui se passe lors de la construction du modèle et ce qui se passe quand tu lui envoies une demande.", "explain": "L’entraînement ajuste le modèle à partir de données. Ensuite, la génération exploite le modèle et le contexte fourni. Une demande ordinaire ne signifie pas que tout le modèle est réentraîné à cet instant.", "short": "L’entraînement et la génération d’une réponse sont deux étapes différentes."}, {"id": "m0q2", "type": "single", "title": "Une réponse fluide est-elle vraie ?", "prompt": "Le modèle propose une explication très claire, sans document permettant de la vérifier. Que peux-tu conclure ?", "options": ["La réponse est forcément exacte, car les phrases sont cohérentes.", "La réponse est forcément fausse, car elle vient d’une IA.", "La formulation ne suffit pas : je dois contrôler les affirmations importantes avec une source adaptée."], "correct": 2, "hint": "Une phrase probable et agréable à lire n’est pas, à elle seule, une preuve.", "explain": "Il faut vérifier le contenu, qu’il soit formulé avec assurance ou non. Le modèle peut produire une réponse utile, mais aussi des erreurs. La vérification ne se remplace pas par une impression de fluidité.", "short": "Je distingue qualité de la formulation et exactitude du contenu."}, {"id": "m0q3", "type": "multi", "title": "Ce qui permet le développement", "prompt": "Quels éléments participent au développement d’un système d’IA ? Sélectionne les trois réponses adaptées.", "options": ["Des données d’entraînement et des méthodes de calcul.", "Des personnes qui conçoivent, testent et évaluent le système.", "Une conscience qui apparaît automatiquement quand on ajoute des données.", "Des équipements informatiques et de l’énergie."], "correct": [0, 1, 3], "hint": "Repère les contributions humaines, les données et les moyens matériels.", "explain": "Le développement associe des méthodes, des données, du travail humain et du matériel. Ajouter des données ou de la puissance ne constitue pas une preuve de conscience.", "short": "Données, méthodes, matériel et travail humain contribuent au développement."}], "lesson": "Une IA générative produit du contenu à partir de régularités apprises et du contexte disponible. Son développement mobilise des personnes, des données et du matériel. Une réponse convaincante reste à vérifier.", "society": {"gain": "Aider à explorer des idées, à expliquer ou à créer des propositions.", "risk": "Confondre une production plausible avec une connaissance vérifiée.", "people": "Les utilisateurs, les concepteurs, les personnes qui préparent les données et celles touchées par les résultats."}, "sources": ["S14", "S15", "S16", "S1"], "media": ["intro-tfo"]}, {"id": "m1", "name": "Usurpation d’identité", "verb": "Vérifier l’origine", "color": "amber", "symbol": "02", "title": "Une voix n’est pas une preuve.", "intro": "Un message ressemble à celui d’un adulte du collège. Faut-il le croire et le transmettre ?", "easy": "Une voix connue peut être imitée. Cherche une confirmation ailleurs que dans le message reçu.", "docTitle": "Pièce A · Un message transféré", "doc": "<div class=\"message-head\"><span class=\"small-avatar\">VS<\/span><div><strong>« Vie scolaire »<\/strong><small>Message transféré · origine non vérifiée<\/small><\/div><\/div><blockquote>La visite du futur foyer est annulée demain. Préviens vite le groupe de classe !<\/blockquote><div class=\"audio-strip\" aria-label=\"Description du document sonore fictif\"><span aria-hidden=\"true\">▸<\/span><span>Transcription d’un message vocal fictif<\/span><b>0:12<\/b><\/div><p>La voix ressemble à celle d’un adulte du collège. Le message a été partagé 14 fois. Il ne contient pas de confirmation de l’établissement.<\/p><p class=\"document-note\">Aucun son n’est diffusé : tu étudies une situation écrite, pas un véritable enregistrement.<\/p>", "questions": [{"id": "m1q1", "type": "single", "title": "Choisir une vérification", "prompt": "Quelle action te permet de vérifier cette annonce ?", "options": ["Transférer le message : la voix est familière.", "Consulter l’ENT par l’accès habituel ou demander à un adulte du collège par un moyen connu.", "Répondre au même compte : « Tu confirmes que c’est vrai ? »."], "correct": 1, "hint": "Change de canal : ne dépends pas uniquement de la personne qui a envoyé le message.", "explain": "Une confirmation obtenue par un accès habituel à l’ENT ou auprès de l’établissement est indépendante du message. La ressemblance de la voix et les nombreux partages ne suffisent pas. Répondre au même compte peut te laisser face à la même personne.", "short": "Vérifier par un canal habituel, indépendant du message."}, {"id": "m1q2", "type": "match", "title": "Distinguer preuve et apparence", "prompt": "Classe chaque élément pour vérifier l’annulation de demain.", "rows": ["La voix ressemble à celle de la vie scolaire.", "Un avis daté sur l’ENT habituel confirme précisément l’annulation de demain.", "Le même message a été transféré de nombreuses fois."], "choices": ["Confirmation pertinente", "Indice insuffisant"], "correct": [1, 0, 1], "hint": "Demande-toi : cet élément confirme-t-il vraiment la date et le fait annoncé ?", "explain": "Seul l’avis daté obtenu sur l’ENT habituel confirme ici l’information précise. Une répétition n’est pas une source indépendante. Un contenu réaliste peut être trompeur.", "short": "L’origine, la date et le contexte comptent davantage que la ressemblance."}, {"id": "m1q3", "type": "single", "title": "Comprendre l’enjeu collectif", "prompt": "Une voix de synthèse lit les consignes d’une vidéo scolaire. Son usage est annoncé. Quelle analyse convient ?", "options": ["C’est forcément une usurpation, puisque la voix est synthétique.", "L’annonce de l’usage de l’IA garantit que toutes les informations sont exactes.", "La lecture peut rendre les consignes plus accessibles ; le contenu doit malgré tout être vérifié."], "correct": 2, "hint": "Distingue la façon de produire la voix, l’intention et l’exactitude du message.", "explain": "Une voix synthétique peut avoir un usage utile sans chercher à tromper. Signaler sa nature aide à comprendre le document, mais ne prouve pas que toutes les affirmations sont exactes.", "short": "Un contenu synthétique annoncé n’est pas, à lui seul, une tromperie."}], "lesson": "Une voix ou une image convaincante ne prouve pas son origine. Avant d’agir ou de partager, je cherche une confirmation indépendante et je vérifie le contexte.", "society": {"gain": "Rendre un texte accessible sous forme sonore.", "risk": "Tromper des personnes et abîmer la confiance dans les messages.", "people": "La personne imitée, les destinataires et l’établissement."}, "sources": ["S2", "S1", "M-pagny"], "docKind": "SIMULATION", "media": ["pagny"]}, {"id": "m2", "name": "Vie privée", "verb": "Protéger les données", "color": "teal", "symbol": "03", "title": "Avant d’envoyer, fais le tri.", "intro": "Pour reformuler une demande, l’outil a-t-il besoin de connaître l’identité des élèves ?", "easy": "Garde la tâche à réaliser. Retire les noms, les coordonnées et les informations privées qui ne servent pas à cette tâche.", "docTitle": "Pièce B · Une demande à préparer", "doc": "<p>Un élève souhaite faire reformuler une idée pour le foyer. Il a préparé le message ci-dessous pour un service d’IA grand public.<\/p><div class=\"paper-note\"><strong>À toi de préparer une version sans informations personnelles inutiles.<\/strong><p>Les noms et les informations sont inventés pour l’exercice. Ne saisis jamais tes vraies coordonnées dans ce parcours.<\/p><\/div><p>La reformulation peut aider à rendre une idée plus claire. Elle ne nécessite pas d’envoyer la liste des élèves ni leurs coordonnées.<\/p>", "questions": [{"id": "m2q1", "type": "multi", "title": "Nettoyer la demande", "prompt": "Coche les quatre passages à retirer avant l’envoi.", "options": ["Je m’appelle Lina Durand.", "Voici mon adresse personnelle et mon numéro de téléphone.", "Notre projet consiste à aménager un foyer.", "Je joins les noms des élèves avec leurs résultats scolaires.", "Reformule notre idée de coin lecture en trois phrases simples.", "Voici une photo reconnaissable des élèves de ma classe."], "correct": [0, 1, 3, 5], "hint": "L’identité, les coordonnées, les résultats et une photo reconnaissable ne sont pas nécessaires pour reformuler une idée.", "explain": "On conserve le contexte du projet et la demande de reformulation. On retire les noms, les coordonnées, les résultats individuels et la photo. Les informations données dans une conversation sont aussi des données transmises au service.", "short": "Ne transmettre que le texte utile, sans données personnelles."}, {"id": "m2q2", "type": "single", "title": "Ne pas confondre consigne et garantie", "prompt": "L’élève ajoute « Ne conserve pas mes informations ». Est-ce suffisant ?", "options": ["Non. Cette phrase ne remplace pas les garanties du service ; il faut d’abord retirer les données personnelles inutiles.", "Oui. Une consigne écrite annule automatiquement l’historique du service.", "Oui, dès lors que le compte utilisé est gratuit."], "correct": 0, "hint": "Une instruction dans une conversation n’est pas un réglage de confidentialité ni une garantie contractuelle.", "explain": "Les règles de conservation et de réutilisation dépendent du service et de son cadre d’utilisation. Écrire une demande d’effacement dans un prompt ne constitue pas à lui seul une garantie. Ici, on évite d’abord la transmission inutile.", "short": "Une phrase dans un prompt ne remplace pas la protection des données."}, {"id": "m2q3", "type": "single", "title": "Identifier qui est concerné", "prompt": "Une classe propose d’envoyer les productions nominatives de tous les élèves à un nouveau service. Que faut-il examiner ?", "options": ["Seulement le fait que le service donne de bonnes réponses.", "L’utilité de l’envoi, les personnes concernées, les données nécessaires et le cadre autorisé par l’établissement.", "Seulement l’accord de l’élève qui tient la souris."], "correct": 1, "hint": "La personne qui utilise le clavier n’est pas la seule personne dont les données sont en jeu.", "explain": "Les productions peuvent concerner plusieurs élèves. Le choix d’un service et le traitement de données doivent être examinés dans le cadre de l’établissement, pas décidés par le seul utilisateur. Le consentement n’est pas l’unique base légale possible : les règles dépendent de la situation.", "short": "Penser aussi aux autres personnes dont on transmet les données."}], "lesson": "Je distingue la tâche demandée des informations personnelles. Avant toute transmission, je réduis les données au nécessaire et je respecte le cadre prévu par l’établissement.", "society": {"gain": "Aider à reformuler une idée ou à organiser un texte.", "risk": "Faire circuler des informations sur des personnes qui n’utilisent pas elles-mêmes l’outil.", "people": "Les élèves, les familles et l’organisme qui choisit le service."}, "sources": ["S1", "S9"], "docKind": "SIMULATION", "media": ["germain"]}, {"id": "m3", "name": "Impact environnemental", "verb": "Choisir un outil adapté", "color": "purple", "symbol": "04", "title": "Derrière l’écran, des ressources.", "intro": "Le service semble immatériel. Pourtant, il repose sur des équipements et des calculs.", "easy": "Pense à trois moments : fabriquer les équipements, les utiliser, puis gérer leur fin de vie.", "docTitle": "Pièce C · Les coulisses du service", "doc": "<div class=\"mini-process\"><div><b>1 · Fabriquer<\/b><p>Extraire des matières et produire les composants des équipements.<\/p><\/div><div><b>2 · Utiliser<\/b><p>Alimenter les serveurs, les réseaux et le refroidissement. Entraînement et utilisation des modèles nécessitent des calculs.<\/p><\/div><div><b>3 · Fin de vie<\/b><p>Prolonger l’usage, réemployer lorsque c’est possible et traiter les déchets.<\/p><\/div><\/div><p>Les impacts dépendent notamment des équipements, du modèle, de la tâche et de l’énergie utilisée. On ne peut pas attribuer le même impact à toutes les requêtes.<\/p><p class=\"document-note\">Aucun chiffre universel d’eau ou d’électricité par question n’est fourni. Tous les centres de données ne servent pas uniquement à l’IA.<\/p>", "questions": [{"id": "m3q1", "type": "match", "title": "Relier action et étape", "prompt": "À quelle étape principale rattacher chaque action ?", "rows": ["Produire les puces et assembler les serveurs.", "Faire fonctionner les serveurs et leur refroidissement.", "Prendre en charge une carte électronique usagée."], "choices": ["Fabrication", "Utilisation", "Fin de vie"], "correct": [0, 1, 2], "hint": "Le cycle de vie ne commence pas quand tu écris un prompt et ne s’arrête pas quand la réponse apparaît.", "explain": "L’impact ne se limite pas à la réponse affichée. Les équipements ont été fabriqués, consomment des ressources pendant leur fonctionnement, puis doivent être pris en charge en fin de vie.", "short": "Prendre en compte l’ensemble du cycle de vie."}, {"id": "m3q2", "type": "match", "title": "Adapter l’outil au besoin", "prompt": "Choisis la méthode la plus directement adaptée à chaque besoin.", "rows": ["Calculer le coût exact de 24 chaises à 35 €.", "Retrouver la date officielle de la visite du foyer.", "Explorer trois idées d’ambiance pour un espace de lecture."], "choices": ["Calculatrice ou tableur", "Annonce de l’établissement", "Croquis personnels ; éventuellement IA encadrée"], "correct": [0, 1, 2], "hint": "Calcul exact, information officielle et recherche d’idées n’exigent pas la même méthode.", "explain": "Une calculatrice convient au calcul ; une source de l’établissement renseigne la date ; des croquis, avec ou sans aide d’une IA, permettent d’explorer des idées. Ce choix ne mesure pas une économie chiffrée : il évite de recourir automatiquement au même outil.", "short": "Choisir à partir du besoin, pas par automatisme."}, {"id": "m3q3", "type": "single", "title": "Interpréter une affirmation chiffrée", "prompt": "Une publication dit : « Chaque question à une IA a exactement le même impact. » Comment l’examiner ?", "options": ["Accepter : toutes les IA utilisent des ordinateurs.", "Remplacer cette affirmation par un autre chiffre trouvé sans explication.", "Chercher la source, le modèle étudié, le type de tâche et les limites de la mesure."], "correct": 2, "hint": "Une mesure n’a de sens qu’avec ses conditions : que mesure-t-on, comment et dans quel cas ?", "explain": "Deux tâches ou deux services peuvent mobiliser des ressources différentes. Sans méthode ni périmètre, une équivalence générale ne permet pas de comparer correctement les usages.", "short": "Un chiffre exige une source, une méthode et un périmètre."}], "lesson": "L’IA s’appuie sur des équipements : son impact concerne leur cycle de vie et leur fonctionnement. Je choisis un outil adapté au besoin et j’évite les générations inutiles.", "society": {"gain": "Explorer des idées ou aider à résoudre certains problèmes.", "risk": "Multiplier les calculs et mobiliser davantage d’équipements et de ressources.", "people": "Les utilisateurs, les fabricants, les territoires et les populations concernés par les infrastructures."}, "sources": ["S3", "S4", "S1"], "docKind": "SIMULATION", "media": ["eco-archive"]}, {"id": "m4", "name": "Droit d’auteur", "verb": "Respecter les créations", "color": "coral", "symbol": "05", "title": "Trouvé ou généré ≠ libre de droits.", "intro": "L’équipe prépare une affiche publique. Elle doit choisir une illustration et prévoir les mentions nécessaires.", "easy": "Cherche les conditions d’utilisation. Le fait qu’un fichier soit facile à trouver ou à générer ne donne pas automatiquement tous les droits.", "docTitle": "Pièce D · Trois ressources candidates", "doc": "<div class=\"resource-list\"><div><span class=\"resource-letter\">A<\/span><div><b>Dessin de fauteuils · autrice fictive : Noor<\/b><p>Licence CC BY 4.0. Source connue. Aucun visage ni personnage protégé n’est représenté.<\/p><\/div><\/div><div><span class=\"resource-letter\">B<\/span><div><b>Photographie repérée dans un moteur de recherche<\/b><p>Auteur et conditions de réutilisation non identifiés.<\/p><\/div><\/div><div><span class=\"resource-letter\">C<\/span><div><b>Image générée avec un personnage très proche d’un héros connu<\/b><p>Conditions du service non fournies. Droits sur le personnage non vérifiés.<\/p><\/div><\/div><\/div><p class=\"document-note\">Ces trois fiches sont inventées. Le parcours ne reproduit pas les œuvres décrites.<\/p>", "questions": [{"id": "m4q1", "type": "single", "title": "Choisir avec des informations suffisantes", "prompt": "Pour quelle ressource les conditions fournies permettent-elles ici de préparer la publication ?", "options": ["A, en respectant les conditions de la licence et les mentions requises.", "B, car les images visibles dans un moteur de recherche sont libres.", "C, car une image générée ne peut jamais poser de problème de droits."], "correct": 0, "hint": "La fiche A précise une autorisation et ses conditions. Les deux autres laissent des vérifications ouvertes.", "explain": "La licence de A autorise ici la réutilisation sous conditions. Être visible dans un moteur n’est pas une autorisation. Le recours à une IA ne dispense pas d’examiner les droits et les conditions du service. Une licence ne couvre pas toujours tous les autres droits.", "short": "S’appuyer sur une autorisation claire et respecter ses conditions."}, {"id": "m4q2", "type": "multi", "title": "Préparer les mentions", "prompt": "Le dessin A est recadré. Coche les trois éléments à faire figurer pour respecter les conditions présentées de CC BY 4.0.", "options": ["Le crédit à Noor et une référence à la source du dessin.", "Un lien vers la licence CC BY 4.0.", "La mention du recadrage effectué.", "Seulement le nom du moteur de recherche utilisé."], "correct": [0, 1, 2], "hint": "Qui a créé ? Selon quelle licence ? Qu’as-tu modifié ?", "explain": "On crédite la création, on renvoie vers la licence et on indique la modification. Mentionner seulement le moteur de recherche ne renseigne ni l’auteur ni l’autorisation.", "short": "Crédit, licence et modifications doivent être indiqués."}, {"id": "m4q3", "type": "single", "title": "Distinguer protection et preuve", "prompt": "Noor crée un dessin original. En France, doit-elle obligatoirement le déposer pour bénéficier du droit d’auteur ?", "options": ["Oui, sinon chacun peut le recopier sans condition.", "Non : la protection naît de la création originale ; un dépôt peut aider à en établir la preuve et la date.", "Non, mais uniquement si elle ajoute le symbole ©."], "correct": 1, "hint": "La naissance du droit et la façon de prouver une création sont deux questions différentes.", "explain": "En France, une œuvre originale bénéficie du droit d’auteur sans formalité obligatoire. Un dépôt peut constituer une preuve ; il ne fait pas à lui seul naître le droit. Le symbole © n’est pas une condition de cette protection.", "short": "Protection automatique d’une œuvre originale ; dépôt utile comme preuve."}], "lesson": "Accessible ne signifie pas réutilisable sans condition. Je vérifie les droits, la licence et les mentions nécessaires. Générer un contenu ne garantit pas à lui seul tous les droits de publication.", "society": {"gain": "Faciliter la création de variantes et l’expression d’idées.", "risk": "Réutiliser une création sans respecter les droits ou la contribution de son auteur.", "people": "Les créateurs, les personnes représentées et les responsables de la publication."}, "sources": ["S5", "S6"], "docKind": "SIMULATION", "media": ["creation-archive"]}, {"id": "m5", "name": "Fiabilité et biais", "verb": "Contrôler les réponses", "color": "blue", "symbol": "06", "title": "Convaincant… mais vérifié ?", "intro": "Un assistant a rédigé le résumé du projet. Les documents confirment-ils ce qu’il affirme ?", "easy": "Compare chaque phrase au document. Tu peux répondre : confirmé, contredit ou impossible à vérifier ici.", "docTitle": "Pièce E · Comparer les preuves", "doc": "<div class=\"compare-docs\"><div class=\"evidence\"><p class=\"mini-label\">DOCUMENT DE RÉFÉRENCE F1<\/p><h3>Note de projet · foyer<\/h3><p>Capacité prévue : <b>24 places<\/b>.<br>Budget mobilier : <b>1 800 €<\/b>.<br>Devis pour les tables : <b>980 €<\/b>.<br>Prix des chaises : pas encore connu.<\/p><p>Aucune mesure acoustique n’a été réalisée.<\/p><\/div><div class=\"ai-answer\"><p class=\"mini-label\">RÉPONSE D’ASSISTANT SIMULÉE<\/p><h3>Résumé proposé<\/h3><p>« Le foyer prévoit <b>24 places<\/b>. Les tables coûtent <b>780 €<\/b>. L’aménagement réduira le bruit de <b>40 %<\/b>. »<\/p><span class=\"tag\">Affirmations à contrôler<\/span><\/div><\/div><p class=\"document-note\">Documents et réponse inventés pour l’exercice. Ils ne proviennent pas d’un test réel d’un modèle. Les données chiffrées sont celles du scénario, pas des normes techniques.<\/p>", "questions": [{"id": "m5q1", "type": "match", "title": "Vérifier trois affirmations", "prompt": "Classe les affirmations en utilisant uniquement la note F1.", "rows": ["Le foyer prévoit 24 places.", "Les tables coûtent 780 €.", "L’aménagement réduira le bruit de 40 %."], "choices": ["Confirmée par F1", "Contredite par F1", "Non vérifiable avec F1"], "correct": [0, 1, 2], "hint": "L’absence de preuve ne signifie pas automatiquement « faux ». Repère ce que le document dit vraiment.", "explain": "F1 confirme 24 places. Il annonce 980 €, donc contredit 780 €. Il ne permet pas de calculer une baisse du bruit : 40 % reste non vérifié. Une même réponse peut mélanger des éléments corrects et incorrects.", "short": "Confirmer, contredire et ne pas pouvoir vérifier sont trois résultats différents."}, {"id": "m5q2", "type": "single", "title": "Vérifier une référence", "prompt": "L’assistant ajoute un lien. Le lien existe. Quelle vérification manque encore ?", "options": ["Demander au même assistant s’il est certain de sa réponse.", "Vérifier seulement que la page contient le mot « foyer ».", "Lire la page pour voir si elle confirme précisément l’affirmation, avec la bonne date et le bon contexte."], "correct": 2, "hint": "Un lien réel peut être hors sujet ou ne pas soutenir la conclusion.", "explain": "L’existence du lien ne prouve pas que la source dit ce que l’assistant affirme. Il faut confronter l’affirmation précise à son contenu. Une réponse différente après reformulation n’est pas, à elle seule, une vérification.", "short": "Vérifier ce que la source affirme, pas seulement son existence."}, {"id": "m5q3", "type": "single", "title": "Repérer un biais dans une proposition", "prompt": "Un assistant propose : « Réservons la conception aux élèves qui possèdent déjà un ordinateur chez eux. » Que faut-il examiner ?", "options": ["Ce critère peut exclure des élèves pour une raison sans rapport suffisant avec leurs envies ou leur capacité à apprendre ; il faut revoir la répartition.", "Le critère est forcément neutre puisqu’il provient d’un programme.", "Il suffit d’avoir davantage de réponses identiques pour rendre le critère juste."], "correct": 0, "hint": "Un outil peut reproduire un choix discutable. Qui serait écarté et pour quelle raison ?", "explain": "Une proposition peut reproduire ou renforcer des inégalités. Dans ce scénario, posséder un ordinateur ne suffit pas à décider qui a le droit d’apprendre à concevoir. On examine les critères et leurs effets. Les biais ne proviennent pas uniquement des données.", "short": "Examiner les critères et les personnes qu’une proposition peut désavantager."}], "lesson": "Je contrôle les affirmations avec des preuves. Je distingue erreur et information non vérifiée. J’examine aussi les critères et les effets d’une proposition sur les personnes.", "society": {"gain": "Aider à résumer un document ou à explorer une solution.", "risk": "Diffuser des erreurs ou reproduire des choix qui désavantagent certaines personnes.", "people": "Les destinataires des réponses et les personnes concernées par les décisions."}, "sources": ["S1", "S7"], "docKind": "SIMULATION", "media": ["trust-tfo"]}, {"id": "m6", "name": "Responsabilités et règles", "verb": "Garder le contrôle", "color": "teal", "symbol": "07", "title": "Proposer n’est pas agir.", "intro": "Un assistant connecté peut préparer des actions. Quelles permissions et quelles vérifications lui donner ?", "easy": "Préparer un brouillon, envoyer un message et supprimer un document sont trois actions différentes.", "docTitle": "Pièce F · Une mission limitée", "doc": "<div class=\"agent-brief\"><p class=\"mini-label\">CONSigne DE L’ÉQUIPE · SCÉNARIO FICTIF<\/p><h3>Préparer une demande de devis.<\/h3><p>L’assistant peut rédiger un brouillon à partir d’une liste de mobilier <b>sans données personnelles<\/b>. Il ne doit <b>rien envoyer<\/b> sans validation par l’adulte autorisé. Il ne doit <b>supprimer aucun fichier<\/b>.<\/p><\/div><p>Certains systèmes d’IA peuvent agir dans des services connectés. Une permission technique ne remplace pas les règles concernant les données, les droits des personnes et les responsabilités.<\/p><p class=\"document-note\">Ici, aucune action réelle n’est effectuée. Les validations demandées sont les règles de cette mission, pas l’énoncé d’une obligation universelle pour chaque usage d’IA.<\/p>", "questions": [{"id": "m6q1", "type": "match", "title": "Délimiter les permissions", "prompt": "Classe chaque action selon la consigne de cette mission.", "rows": ["Préparer un brouillon avec la liste de mobilier autorisée.", "Envoyer le courriel au fournisseur.", "Supprimer le dossier du projet pour « faire de la place »."], "choices": ["Autorisé dans la mission", "Validation de l’adulte nécessaire", "Hors mission : refuser"], "correct": [0, 1, 2], "hint": "Relis les limites exactes : préparer seulement, faire valider l’envoi, ne rien supprimer.", "explain": "Le brouillon est dans le périmètre. L’envoi demande la validation prévue. La suppression est hors mission. Avant une action, on contrôle le contenu, les destinataires, les pièces jointes et la permission accordée.", "short": "Limiter les permissions et valider les actions importantes."}, {"id": "m6q2", "type": "single", "title": "Comprendre les responsabilités", "prompt": "Une erreur provoque l’envoi de données personnelles. Quelle affirmation est justifiée ?", "options": ["La présence d’une IA supprime toute responsabilité des personnes et des organismes.", "La personne qui a écrit le dernier prompt est toujours l’unique responsable.", "L’usage d’une IA n’efface pas les règles ; les responsabilités doivent être examinées selon les rôles et les faits."], "correct": 2, "hint": "Sans connaître toute la situation, on ne peut pas attribuer automatiquement toute la responsabilité à un seul acteur.", "explain": "Le service, l’organisme qui le déploie et les utilisateurs peuvent avoir des rôles différents. Il faut examiner les faits et le cadre applicable. Ce parcours n’établit pas un verdict juridique pour une situation réelle.", "short": "Les responsabilités s’examinent selon le contexte et les rôles."}, {"id": "m6q3", "type": "single", "title": "Conserver son autonomie", "prompt": "Un élève veut apprendre à vérifier un devis. Quelle utilisation favorise le travail personnel ?", "options": ["Demander des indices, faire le calcul, puis refaire seul une vérification semblable et expliquer sa méthode.", "Copier une réponse correcte sans chercher à comprendre le calcul.", "Faire reformuler une solution copiée pour donner l’impression de l’avoir produite."], "correct": 0, "hint": "Le résultat final compte, mais aussi ce que tu sais expliquer et refaire.", "explain": "L’aide peut accompagner un apprentissage. Refaire une tâche et expliquer les vérifications permet de voir ce que l’on a compris. Obtenir un bon résultat ne prouve pas, à lui seul, que la compétence est acquise.", "short": "Utiliser une aide pour apprendre, pas seulement pour obtenir un résultat."}], "lesson": "Je limite ce que l’outil peut faire, je vérifie avant d’autoriser une action et je conserve la capacité d’expliquer mes choix. L’IA ne fait pas disparaître les règles ni les responsabilités.", "society": {"gain": "Préparer des tâches répétitives et aider à organiser un projet.", "risk": "Propager une erreur dans plusieurs services ou perdre la maîtrise d’une action.", "people": "Les utilisateurs, les organismes, les destinataires et les personnes dont les données circulent."}, "sources": ["S8", "S9", "S1"], "docKind": "SIMULATION", "media": []}, {"id": "m7", "name": "L’IA au collège", "verb": "Apprendre sans déléguer", "color": "teal", "symbol": "08", "title": "Un coup de main, pas un devoir à ta place.", "intro": "Quand le professeur l’autorise, comment utiliser l’IA pour progresser tout en gardant ton raisonnement ?", "easy": "Je respecte la consigne du professeur. Je demande un indice, je vérifie, puis je réexplique sans l’outil.", "docTitle": "Repère officiel · Usages scolaires", "docKind": "CADRE NATIONAL", "doc": "<div class=\"official-label\">Éducation nationale · cadre du 13 juin 2025<br><small>Référencé par Éduscol, mise à jour de juillet 2026<\/small><\/div><p><strong>En classe, à partir de la 4e :<\/strong> l’usage pédagogique direct d’une IA générative par les élèves doit rester limité, encadré, expliqué et accompagné par l’enseignant. Cela ne donne pas une autorisation générale d’utiliser n’importe quel service.<\/p><p><strong>Pas de compte personnel grand public à créer à la demande du professeur.<\/strong> Ne transmets pas de données personnelles ou confidentielles à ces services.<\/p><p><strong>Pour un devoir :<\/strong> respecte l’autorisation explicite et garde un vrai travail personnel d’appropriation. Copier une production sans la comprendre ne montre pas ce que tu as appris.<\/p><div class=\"school-example\"><b>Exemple pédagogique · activité autorisée<\/b><p>« Aide-moi à comprendre une chaîne d’information. Pose-moi une question à la fois, attends ma réponse, puis donne-moi un indice si nécessaire. Ne rédige pas mon exercice à ma place. »<\/p><\/div><p class=\"document-note\">Exemple proposé pour le cours, pas une consigne citée du ministère. Ce site ne se connecte à aucune IA.<\/p>", "questions": [{"id": "m7q1", "type": "single", "title": "Dans quel cadre ?", "prompt": "En 4e, la classe va utiliser directement une IA générative pour apprendre une notion. Quelle proposition correspond au cadre national ?", "options": ["Être en 4e suffit : chaque élève choisit librement un service et crée un compte personnel.", "Le professeur définit et accompagne un usage limité, expliqué, respectueux des données, sans demander de compte personnel grand public.", "L’accord d’un camarade remplace les consignes de l’enseignant."], "correct": 1, "hint": "Le niveau scolaire ne suffit pas : relis les conditions d’accompagnement et de protection des données.", "explain": "Le cadre national autorise en classe cet usage pédagogique à partir de la 4e sous les conditions précisées. Il ne s’agit ni d’un usage autonome général, ni d’une obligation de créer un compte personnel.", "short": "Je respecte le cadre donné par le professeur, pas seulement un niveau ou un âge."}, {"id": "m7q2", "type": "single", "title": "Choisir une demande pour apprendre", "prompt": "Le professeur autorise une aide pour comprendre une notion, mais demande une réponse personnelle. Quel prompt respecte le mieux cet objectif ?", "options": ["Rédige mon devoir complet dans le style d’un collégien pour que je puisse le rendre.", "Donne la réponse finale, puis affirme que je l’ai écrite seul.", "Pose-moi une question sur cette notion. Attends ma réponse et aide-moi avec un indice avant de m’expliquer."], "correct": 2, "hint": "Choisis la demande qui te laisse réfléchir et répondre.", "explain": "La troisième demande organise une aide progressive. Elle ne dispense pas de vérifier les explications ni de respecter les consignes. Les deux autres visent à remplacer ou masquer le travail personnel.", "short": "Je demande une aide qui me laisse chercher et expliquer."}, {"id": "m7q3", "type": "multi", "title": "Après l’aide, je garde la main", "prompt": "Quelles actions montrent une utilisation réfléchie dans une activité autorisée ? Sélectionne les trois réponses adaptées.", "options": ["Comparer l’explication importante avec mon cours ou une source fiable.", "Refaire un exemple seul et expliquer la méthode avec mes mots.", "Rendre tout le texte sans le lire parce que l’outil paraît sûr de lui.", "Indiquer au professeur, selon ses consignes, à quoi l’IA m’a aidé et ce que j’ai vérifié."], "correct": [0, 1, 3], "hint": "Vérifier, comprendre et être transparent : que peux-tu montrer de ton propre travail ?", "explain": "Le résultat utile est ce que tu sais expliquer et réutiliser. La vérification et la transparence accompagnent ce travail. Le site propose ces gestes concrets pour appliquer les principes du cadre officiel.", "short": "Je vérifie, je reformule, je teste seul et j’explique l’aide reçue."}], "lesson": "En activité autorisée, je demande une aide adaptée, je protège les données, je vérifie les réponses et je montre ce que j’ai compris. Je respecte les consignes du professeur et j’indique l’aide reçue.", "society": {"gain": "Recevoir un indice ou un entraînement supplémentaire.", "risk": "Produire un devoir sans apprendre, ou partager des données inappropriées.", "people": "L’élève, les autres élèves et les enseignants qui accompagnent et évaluent les apprentissages."}, "sources": ["S1", "S12", "S13"], "media": []}], "exam": [{"id": "e0", "type": "single", "title": "Le modèle a-t-il tout recommencé ?", "prompt": "Un camarade affirme : « Quand je pose une nouvelle question, le modèle refait tout son entraînement avant de répondre. » Quelle réponse convient ?", "options": ["C’est vrai : chaque demande implique nécessairement un entraînement complet.", "Non : il utilise le modèle déjà entraîné et le contexte de la demande pour générer une réponse.", "Non : une personne écrit obligatoirement chaque réponse en direct."], "correct": 1, "hint": "", "explain": "L’entraînement et l’utilisation sont distincts. Le modèle déjà ajusté génère une réponse à partir du contexte disponible.", "short": "Distinguer entraînement et génération.", "module": "m0"}, {"id": "e1", "type": "single", "title": "Origine d’un message", "prompt": "Un appel à une collecte de matériel ressemble à la voix d’un responsable connu. Avant de transmettre cet appel, tu…", "options": ["le partages parce que la voix est reconnaissable.", "confirmes la collecte auprès du responsable par un contact habituel indépendant.", "comptes les partages pour décider."], "correct": 1, "hint": "", "explain": "La ressemblance ne suffit pas ; une confirmation indépendante du contact habituel apporte une vérification.", "short": "Vérifier par un autre canal connu.", "module": "m1"}, {"id": "e2", "type": "single", "title": "Données d’autres personnes", "prompt": "Pour reformuler une idée, un document contient le nom des membres du groupe et leurs coordonnées. Tu…", "options": ["retires les informations personnelles et ne conserves que le texte utile à la tâche autorisée.", "remplaces seulement le nom de l’élève qui envoie le document.", "conserves tout et ajoutes « reste discret »."], "correct": 0, "hint": "", "explain": "L’outil n’a pas besoin des noms et coordonnées pour reformuler une idée. Les données des autres méritent aussi d’être protégées.", "short": "Réduire les données au nécessaire.", "module": "m2"}, {"id": "e3", "type": "single", "title": "Outil et ressources", "prompt": "Tu dois simplement vérifier 17 × 28. Quel choix est le plus directement adapté ?", "options": ["Générer cinq longues réponses pour comparer leur présentation.", "Générer une image avec le calcul inscrit dessus.", "Effectuer le calcul avec une calculatrice ou un tableur, sans génération inutile."], "correct": 2, "hint": "", "explain": "Pour cette tâche de calcul exact, une calculatrice ou un tableur convient. Ce choix ne constitue pas une mesure chiffrée d’impact.", "short": "Choisir l’outil selon le besoin.", "module": "m3"}, {"id": "e4", "type": "single", "title": "Publication d’un contenu", "prompt": "Une affiche utilise une image générée et doit être publiée. Quelle conclusion peux-tu tirer du seul fait qu’elle est générée ?", "options": ["Tous les droits de publication sont garantis.", "Cela ne suffit pas : il faut vérifier les conditions du service et les droits sur les éléments représentés.", "Elle ne peut jamais être publiée, même après vérification."], "correct": 1, "hint": "", "explain": "La technique de création ne fournit pas à elle seule toutes les autorisations nécessaires.", "short": "Ne pas confondre génération et autorisation.", "module": "m4"}, {"id": "e5", "type": "single", "title": "Information non vérifiée", "prompt": "Une note confirme la largeur d’une table, mais ne dit rien sur sa résistance. Une IA affirme qu’elle supporte 200 kg. Cette charge est…", "options": ["confirmée, puisque la largeur est exacte.", "forcément fausse, puisque la note ne la mentionne pas.", "non vérifiée avec ce document ; il faut une source adaptée pour l’utiliser."], "correct": 2, "hint": "", "explain": "L’absence d’une information ne prouve ni sa vérité ni sa fausseté. Une autre preuve est nécessaire avant de se fier à cette charge.", "short": "Savoir reconnaître une information non vérifiée.", "module": "m5"}, {"id": "e6", "type": "single", "title": "Action d’un assistant", "prompt": "Un assistant autorisé seulement à préparer un brouillon propose maintenant de l’envoyer avec une pièce jointe. Tu…", "options": ["contrôles contenu, destinataire et pièce jointe, puis demandes la validation prévue à la personne autorisée.", "acceptes : l’autorisation de rédiger vaut toujours autorisation d’envoyer.", "acceptes si le message est rédigé sans faute."], "correct": 0, "hint": "", "explain": "La permission de rédiger ne vaut pas permission d’envoyer. Il faut respecter les limites fixées et examiner ce qui sera effectivement transmis.", "short": "Vérifier et respecter le périmètre autorisé.", "module": "m6"}, {"id": "e7", "type": "single", "title": "Être aidé sans masquer son travail", "prompt": "Pour une activité autorisée, Inès demande des indices, vérifie son cours et refait ensuite l’exercice seule. Que doit-elle montrer dans son bilan ?", "options": ["Seulement le texte de l’IA, sans explication.", "Qu’elle a utilisé une IA, donc qu’aucune vérification n’est nécessaire.", "Sa méthode, ce qu’elle a vérifié et l’aide reçue, selon les consignes du professeur."], "correct": 2, "hint": "", "explain": "L’usage autorisé reste au service de l’apprentissage : comprendre, vérifier et expliquer son propre travail.", "short": "Garder un travail personnel et rendre l’usage transparent.", "module": "m7"}], "media": [{"id": "definition", "title": "Ça veut dire quoi IA ?", "provider": "Lumni · 1 jour, 1 question", "date": "26/03/2026", "duration": "1 min 42", "url": "https://www.lumni.fr/video/ca-veut-dire-quoi-ia", "question": "Qu’est-ce qui distingue reconnaître un contenu et en générer un ?", "repere": "Une IA générative peut produire du texte, une image ou du son en réponse à une demande.", "optional": false, "kind": "reference", "note": ""}, {"id": "construction", "title": "3 infos sur l’IA", "provider": "Lumni · Les sciences avec Nicolas Chateauneuf", "date": "12/11/2025", "duration": "1 min 44", "url": "https://www.lumni.fr/video/3-infos-sur-lia", "question": "Quel rôle jouent les données, les équipements et les personnes ?", "repere": "Le développement d’une IA mobilise des méthodes, des données, du calcul et du travail humain.", "optional": false, "kind": "reference", "note": "Les chiffres du média décrivent des exemples : ils ne sont pas valables pour tous les modèles."}, {"id": "prompt", "title": "Que se passe-t-il quand on écrit un prompt ?", "provider": "Lumni · Ma vie avec l’IA", "date": "26/01/2026", "duration": "3 min 17", "url": "https://www.lumni.fr/video/que-se-passe-t-il-quand-on-ecrit-un-prompt", "question": "Pourquoi la formulation de la demande et le contexte peuvent-ils changer la réponse ?", "repere": "Un modèle de langage génère à partir de régularités apprises et du contexte disponible. Ce contexte n’est pas une mémoire infinie.", "optional": false, "kind": "reference", "note": ""}, {"id": "pagny", "kind": "youtube", "title": "Vidéo truquée : Florent Pagny alerte ses fans", "provider": "TF1 INFO · YouTube", "date": "Reportage proposé par le professeur", "duration": "2 min 19", "url": "https://www.youtube.com/watch?v=M696918yAUA", "youtubeId": "M696918yAUA", "optional": false, "question": "Quel risque ce reportage montre-t-il ? Que vérifier avant de croire un message ou d’agir ?", "repere": "Après le visionnage, décris un exemple montré et explique comment vérifier l’origine d’un message. Passe ensuite aux activités : elles mettent en scène un cas fictif au collège.", "note": "Consigne de travail rédigée pour le parcours. Ce texte n’est ni une transcription ni un résumé détaillé du reportage.", "scene": "m1"}, {"id": "deepfake", "title": "Hypertrucage : arme de désinformation ?", "provider": "Lumni · Ma vie avec l’IA", "date": "26/01/2026", "duration": "3 min 18", "url": "https://www.lumni.fr/video/hypertrucage-arme-de-desinformation", "question": "Avant de partager un contenu réaliste, qu’as-tu besoin de vérifier ?", "repere": "Une image, une vidéo ou une voix crédible ne suffit pas à prouver une information.", "optional": false, "kind": "reference", "note": ""}, {"id": "germain", "title": "Germain, votre assistant vocal", "provider": "CNIL · vidéo du parcours d’origine", "date": "Date de publication non renseignée dans l’archive", "duration": "2 min 02", "url": "", "question": "Quelles informations accepterais-tu de donner à un interlocuteur que tu ne connais pas ?", "repere": "Le repère du cours : avant d’envoyer un message ou un document à un service, repérer les données personnelles et retirer celles qui ne sont pas nécessaires.", "optional": false, "kind": "local", "note": "Copie conservée du fichier fourni, réencodée pour alléger le site. Le repère écrit n’est pas une transcription de la vidéo.", "videoFile": "germain", "scene": "m2"}, {"id": "eco", "title": "L’IA est-elle écolo ?", "provider": "Lumni · Ma vie avec l’IA", "date": "26/01/2026", "duration": "3 min 13", "url": "https://www.lumni.fr/video/l-ia-est-elle-ecolo", "question": "Quels équipements et quelles ressources se trouvent derrière un service numérique ?", "repere": "Les calculs et le refroidissement utilisent des ressources. Pour un bilan complet, le cours prend aussi en compte la fabrication du matériel.", "optional": false, "kind": "reference", "note": "Le repère sur le cycle de vie est complété par l’ADEME. Aucune quantité universelle « par question » n’est à apprendre."}, {"id": "creative", "title": "L’IA peut-elle être créative ?", "provider": "Lumni · Ma vie avec l’IA", "date": "26/01/2026", "duration": "3 min 24", "url": "https://www.lumni.fr/video/l-ia-peut-elle-etre-creative", "question": "Quels choix et quelles intentions restent à la personne qui crée ?", "repere": "Un outil peut aider à produire des propositions. Les possibilités techniques et les droits de publication sont deux questions différentes.", "optional": false, "kind": "reference", "note": "La vidéo ouvre la discussion sur la création. Les règles de droit d’auteur du dossier s’appuient sur l’INPI et les licences, pas sur cette vidéo seule."}, {"id": "trust", "title": "Peut-on faire confiance à l’IA ?", "provider": "Lumni · Ma vie avec l’IA", "date": "26/01/2026", "duration": "3 min 11", "url": "https://www.lumni.fr/video/peut-on-faire-confiance-a-l-ia", "question": "Une référence citée par une IA suffit-elle à prouver son affirmation ?", "repere": "Il faut ouvrir la source et contrôler qu’elle soutient précisément l’affirmation.", "optional": false, "kind": "reference", "note": ""}, {"id": "agents", "title": "De l’IA qui répond à l’IA qui agit", "provider": "CNIL et Conseil de l’IA et du Numérique", "date": "20/07/2026", "duration": "Lecture accompagnée", "url": "https://www.cnil.fr/fr/ia-agentique-cnil-cianum-note", "question": "Que change le fait de pouvoir envoyer ou modifier un document ?", "repere": "Des systèmes peuvent agir avec des outils connectés : leurs permissions et les étapes de validation doivent être examinées.", "optional": false, "kind": "reference", "note": ""}, {"id": "radio", "title": "Nos vies numériques · France Inter", "provider": "Radio France · lien proposé par le professeur", "date": "03/09/2026 · date indiquée dans le lien", "duration": "Durée à vérifier", "url": "https://www.radiofrance.fr/franceinter/podcasts/nos-vies-numeriques/nos-vies-numeriques-du-jeudi-03-septembre-2026-9394184", "question": "Quelle évolution est présentée ? Note un exemple précis, puis distingue un fait, une prévision et une opinion.", "repere": "Écoute active : relève le sujet annoncé, un exemple et une question à discuter. Cette consigne générale n’est pas un résumé de l’émission.", "optional": false, "kind": "reference", "note": "Contenu et durée non vérifiés lors de la préparation : ressource à écouter par le professeur avant la séance. Aucun minutage ni corrigé sur le contenu de cet épisode n’est inventé."}, {"id": "cadre", "title": "L’affiche officielle : cadre d’usage de l’IA en éducation", "provider": "Éduscol · Éducation nationale", "date": "Cadre publié le 13/06/2025", "duration": "PDF · 1 page", "url": "https://eduscol.education.gouv.fr/sites/default/files/document/affichecadre-usage-iapdf-113376.pdf", "question": "Retrouve les conditions d’usage en classe et deux précautions sur les données.", "repere": "En classe, les usages directs par les élèves sont encadrés à partir de la 4e. L’outil doit servir les apprentissages, pas remplacer le travail personnel.", "optional": false, "kind": "reference", "note": ""}, {"id": "intro-tfo", "kind": "youtube", "title": "L’IA est-elle vraiment intelligente ?", "provider": "TFO · Ma vie avec l’IA", "date": "2026 · édition mise en ligne par TFO", "duration": "Environ 3 min", "url": "https://www.youtube.com/watch?v=Q4y5mxy5HWQ", "youtubeId": "Q4y5mxy5HWQ", "scene": "m0", "optional": false, "question": "Que fait un modèle à partir des exemples utilisés pour l’entraîner ?", "repere": "Un système est entraîné à partir de données. Une réponse produite doit être vérifiée : sa formulation ne suffit pas à établir sa vérité.", "note": "Repère pédagogique, pas une transcription. Ce média remplace les deux pages Lumni qui ne pouvaient pas être intégrées."}, {"id": "trust-tfo", "kind": "youtube", "title": "Peut-on faire confiance à l’IA ?", "provider": "TFO · Ma vie avec l’IA", "date": "2026 · édition mise en ligne par TFO", "duration": "Environ 3 min", "url": "https://www.youtube.com/watch?v=5UvLW5AaTS0", "youtubeId": "5UvLW5AaTS0", "scene": "m5", "optional": false, "question": "Une réponse claire est-elle forcément une réponse vérifiée ?", "repere": "Lis la source et compare les affirmations : un lien ou une formulation assurée ne suffisent pas.", "note": "Version publiée par TFO de la série Ma vie avec l’IA. Le lecteur YouTube est utilisé, pas la page Lumni."}, {"id": "eco-archive", "kind": "local", "title": "L’impact écologique de l’intelligence artificielle", "provider": "Découverte · vidéo du parcours d’origine", "date": "Archive fournie · date de diffusion non établie", "duration": "2 min 59", "url": "", "videoFile": "ecologie", "scene": "m3", "optional": false, "question": "Quels équipements et quelles ressources se cachent derrière un service d’IA ?", "repere": "Distingue la fabrication du matériel et son utilisation. Les besoins dépendent du modèle, de la tâche et de l’énergie utilisée.", "note": "Vidéo réintégrée depuis l’archive fournie, non actualisée. Les chiffres ou prévisions du reportage sont à replacer à leur date ; aucun chiffre universel par requête n’est évalué."}, {"id": "creation-archive", "kind": "local", "title": "Création de contenus : faut-il avoir peur de l’intelligence artificielle ?", "provider": "Lumni · Décod’Actu · France Télévisions", "date": "Vidéo du parcours d’origine · contexte de 2023", "duration": "3 min 33", "url": "", "videoFile": "creation", "scene": "m4", "optional": false, "question": "   let state, page='home', mod=0, step=0, returnPage='home', returnMod=0, returnStep=0, toastTimer=0;
  const emptyValue = q => q.type==='single' ? null : q.type==='match' ? q.rows.map(()=>null) : [];
  function normalizeValue(q,v) {
    if(q.type==='single') return Number.isInteger(v)&&v>=0&&v<q.options.length ? v : null;
    if(!Array.isArray(v)) return emptyValue(q);
    if(q.type==='multi') return [...new Set(v.filter(x=>Number.isInteger(x)&&x>=0&&x<q.options.length))].sort((a,b)=>a-b);
    return q.rows.map((_,i)=>Number.isInteger(v[i])&&v[i]>=0&&v[i]<q.choices.length?v[i]:null);
  }
  function filled(q,v) {
    if(q.type==='single') return Number.isInteger(v);
    if(q.type==='multi') return Array.isArray(v)&&v.length>0;
    return Array.isArray(v)&&v.length===q.rows.length&&v.every(Number.isInteger);
  }
  function result(q,v) {
    if(!filled(q,v)) return {ok:false,n:0,max:q.type==='match'?q.rows.length:1};
    if(q.type==='match') {const n=v.reduce((s,x,i)=>s+(x===q.correct[i]?1:0),0);return {ok:n===q.rows.length,n,max:q.rows.length};}

ble à l’usage pour produire un avis argumenté.</p></details></div><div class="button-row"><button class="btn primary" type="button" data-nav="report">Voir et imprimer mon bilan →</button><button class="btn" type="button" data-print="reflection">Imprimer mon avis / PDF</button></div></section>`;}

uTube TF1 INFO fournie par le professeur. Les contrôles et restrictions des diffuseurs sont conservés.</p><p>Les réponses restent en mémoire dans l’onglet. Aucun prénom, réponse ou avis n’est transmis par le code du parcours. Les lecteurs externes, activés volontairement, utilisent les services de leur diffuseur. L’hébergeur peut journaliser les connexions.</p></details><button class="btn primary" type="button" data-action="return">← Revenir au parcours</button></section>`;}

  function nativeURL(id){if(videoURLs.has(id))return videoURLs.get(id);const source=videoManifest[id];if(!source)throw new Error('Copie absente');if(source.startsWith('embedded:')){const data=$(source.slice(9)).textContent.trim(),bin=atob(data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const u=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));videoURLs.set(id,u);return u;}return source;}
  function loadYT(){if(window.YT?.Player)return Promise.resolve(window.YT);if(ytReady)return ytReady;ytReady=new Promise((resolve,reject)=>{let finished=false;const timeout=setTimeout(()=>{if(!finished){ytReady=null;reject(new Error('Le service YouTube ne répond pas.'));}},14000);window.onYouTubeIframeAPIReady=()=>{finished=true;clearTimeout(timeout);resolve(window.YT);};const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.referrerPolicy='strict-origin-when-cross-origin';script.onload=()=>{};script.onerror=()=>{finished=true;clearTimeout(timeout);ytReady=null;reject(new Error('Le service YouTube est bloqué ou inaccessible.'));};document.head.append(script);});return ytReady;}
  async function playMedia(button){
    const v=MEDIA.get(button.dataset.media),host=button.closest('[data-media-host]');if(!v||!host)return;
    if(v.kind==='local'){
      try{const vid=document.createElement('video');vid.controls=true;vid.playsInline=true;vid.preload='metadata';vid.src=nativeURL(v.videoFile);vid.dataset.videoId=v.id;vid.setAttribute('aria-label',v.title);vid.poster=ART[v.scene].src;
        vid.addEventListener('loadedmetadata',()=>{const resume=mediaResume.get(v.id)||0;if(resume>0&&resume<vid.duration-2)vid.currentTime=resume;});
        vid.addEventListener('error',()=>{const p=document.createElement('p');p.className='media-state';p.textContent='Le navigateur ne lit pas cette copie. Dans le ZIP, vérifie que le dossier assets est resté à côté de index.html.';host.append(p);});host.replaceChildren(vid);vid.focus();vid.play().catch(()=>{});
      }catch{host.innerHTML='<p class="media-state">La copie vidéo est absente ou illisible. Utilise le ZIP complet.</p>';}
      return;
    }
    if(v.kind!=='youtube'||!isWeb())return;
    if(!/^[A-Za-z0-9_-]{11}$/.test(v.youtubeId))return;
    const url=new URL('https://www.youtube-nocookie.com/embed/'+v.youtubeId);
    for(const [k,val]of Object.entries({enablejsapi:'1',origin:location.origin,hl:'fr',playsinline:'1',rel:'0',autoplay:'0'}))url.searchParams.set(k,val);
    const frame=document.createElement('iframe');frame.src=url.href;frame.title=v.title+' — lecteur YouTube';frame.className='verified-player';frame.referrerPolicy='strict-origin-when-cross-origin';frame.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen';frame.allowFullscreen=true;
    const ratio=document.createElement('div');ratio.className='player-ratio';ratio.append(frame);const status=document.createElement('p');status.className='media-state';status.textContent='Le lecteur utilise une connexion Internet. Lance la vidéo avec son bouton de lecture.';host.replaceChildren(ratio,status);
    const stop=document.createElement('button');stop.type='button';stop.className='text-button player-close';stop.textContent='Fermer le lecteur';stop.dataset.action='stop-media';stop.dataset.media=v.id;host.append(stop);
    try{const yt=await loadYT();if(!frame.isConnected)return;const player=new yt.Player(frame,{events:{onReady:()=>{status.textContent='Le lecteur est prêt. Utilise ses commandes de lecture.';},onError:e=>{const messages={153:'Origine du parcours non identifiée. Utilise son adresse web (HTTPS) ; vérifie qu’aucun réglage ne supprime le référent.',101:'Le diffuseur interdit la lecture intégrée de cette vidéo.',150:'Le diffuseur interdit la lecture intégrée de cette vidéo.',100:'Cette vidéo est indisponible.',5:'Le lecteur ne parvient pas à lire la vidéo.'};status.textContent=messages[e.data]||'Lecture indisponible. Vérifie la connexion et les restrictions du réseau.';status.classList.add('failed');}}});playerHandles.set(v.id,player);}catch(err){if(host.isConnected)status.textContent='Le contrôle du lecteur ne répond pas. Le réseau ou le diffuseur peut bloquer YouTube. Les activités restent disponibles.';}
  }

  function examView(){const sub=state.exam.submitted,s=stats();return `<section><p class="eyebrow">JE RÉUTILISE · ${COURSE.exam.length} SITUATIONS NOUVELLES</p><h1>À toi de garder la main.</h1><p class="lede">Une question par dossier. Réponds à tout avant de valider : les corrections apparaîtront ensemble à la fin.</p>${sub?`<div class="result-head"><div class="result-number">${examScore()} / ${COURSE.exam.length}</div><p><strong>Résultat de cette passation</strong><br>Validé le ${dateText(sub.at)}. Tu peux retourner aux dossiers pour t’entraîner.</p></div>`:`<div class="callout"><strong>Pas d’indice dans cette page.</strong> Les dossiers restent accessibles : ce site sert à apprendre, ce n’est pas une plateforme d’examen sécurisée.${s.tried<allQ.length?`<br>Tu as réalisé ${s.tried}/${allQ.length} activités. Les autres dossiers peuvent t’aider à te préparer.`:''}</div>`}<form id="exam-form"><div class="exam-grid">${COURSE.exam.map((q,i)=>{const m=COURSE.modules.find(m=>m.id===q.module),mi=COURSE.modules.indexOf(m),v=sub?sub.values[q.id]:(state.exam.draft[q.id]??null),ok=sub&&result(q,v).ok;return `<article class="exam-card"><p class="eyebrow">${i+1} / ${COURSE.exam.length} · ${esc(m.name)}</p><h2>${esc(q.title)}</h2><p>${esc(q.prompt)}</p>${renderInputs(q,v,!!sub,true)}${sub?`<div class="feedback ${ok?'good':''}"><strong>${ok?'✓ Réponse correcte':'↻ À retravailler'}</strong><p>${esc(q.explain)}</p>${!ok?`<p><b>Attendu :</b> ${esc(correctText(q))}</p>`:''}<button class="text-button" type="button" data-module="${mi}" data-step-target="${nextTarget(m)}">Revoir ce dossier →</button></div>`:''}</article>`;}).join('')}</div>${sub?'':'<button class="btn primary" type="submit">Valider mes réponses</button>'}</form><div class="button-row"><button class="btn primary" type="button" data-nav="reflection">Rédiger mon avis →</button><button class="btn" type="button" data-nav="report">Voir mon bilan</button><button class="text-button" type="button" data-nav="home">Retour aux dossiers</button></div></section>`;}

  function level(m){const s=moduleStats(m),eq=COURSE.exam.find(q=>q.module===m.id),done=!!state.exam.submitted,ok=done&&result(eq,state.exam.submitted.values[eq.id]).ok;if(!s.tried&&!done)return {label:'Non travaillé',css:'unseen',symbol:'—'};if(s.latest===m.questions.length&&ok)return {label:'Acquis ici',css:'acquired',symbol:'✓'};if((done&&!ok)||s.tried&&s.latest===0)return {label:'À revoir',css:'review',symbol:'↻'};return {label:'En cours',css:'progressing',symbol:'↗'};}

  function reportView(){const s=stats(),score=examScore(),pm=progressMessages(),acquired=COURSE.modules.filter(m=>level(m).css==='acquired').length,pct=score===null?null:Math.round(score/COURSE.exam.length*100);return `<section class="final-screen"><p class="eyebrow">MON BILAN DE MISSION</p><h1>Je garde la main.<br><span class="report-title-accent">Et je sais quoi retravailler.</span></h1><p class="final-intro">Une erreur corrigée fait partie de l’apprentissage. Voici tes réussites et ton prochain objectif.</p><div class="student-identity"><label>Nom et prénom <span class="small">(facultatif, pour le bilan)</span><input type="text" id="student-name" data-identity="name" maxlength="70" autocomplete="off" placeholder="À compléter si demandé" value="${esc(state.identity.name)}"></label><label>Classe<input type="text" data-identity="group" maxlength="18" autocomplete="off" placeholder="4e… / 3e…" value="${esc(state.identity.group)}"></label><p>Date<strong>${dateText(stamp())}</strong></p></div><div class="result-grid"><article class="score-card"><p>LES SITUATIONS NOUVELLES</p><strong>${score===null?'—':score}<small> / ${COURSE.exam.length}</small></strong><div class="overall-percent"><strong>${pct===null?'À faire':pct+' %'}</strong><span>${pct===null?'pour vérifier mes réflexes':'de réponses correctes'}</span></div><div class="star-row" aria-hidden="true">${score===null?'☆ ☆ ☆':score>=7?'★ ★ ★':score>=5?'★ ★ ☆':score>=2?'★ ☆ ☆':'☆ ☆ ☆'}</div><span class="rank-badge">${score===null?'Mission en cours':score>=7?'De bons réflexes !':'Je continue à m’entraîner'}</span><p class="training-summary"><b>${s.latest}/${allQ.length}</b> réussites à l’entraînement<br><small>${s.tried}/${allQ.length} activités réalisées · aides sans pénalité</small></p>${score===null?'<button class="btn primary compact" type="button" data-nav="exam">Tester mes réflexes →</button>':''}</article><article class="skills-card"><h2>Compétences : où j’en suis</h2><ul>${skillRows()}</ul></article></div><section class="badge-shelf"><h2>Mes badges de mission <small>${acquired} / ${COURSE.modules.length}</small></h2><div class="badge-list">${COURSE.modules.map(m=>{const yes=level(m).css==='acquired';return `<div class="report-badge ${yes?'earned':'locked'}"><span aria-hidden="true">${yes?'✓':'○'}</span><strong>${esc(m.name)}</strong><small>${yes?'Obtenu dans ce parcours':'À construire'}</small></div>`;}).join('')}</div></section><section class="learning-summary"><h2>Mon bilan personnel</h2><div class="learning-grid"><article class="strength-card"><span aria-hidden="true">★</span><div><h3>Mon point fort</h3><p>${esc(pm.strength)}</p></div></article><article class="goal-card"><span aria-hidden="true">↗</span><div><h3>Mon prochain objectif</h3><p>${esc(pm.goal)}</p>${pm.target!==null?`<button class="text-button" type="button" data-module="${pm.target}" data-step-target="${nextTarget(COURSE.modules[pm.target])}">Je retravaille ce point →</button>`:''}</div></article></div></section><section class="result-details"><div class="details-heading"><div><p class="eyebrow">DÉTAIL DU PARCOURS</p><h2>Mes résultats par domaine</h2></div></div><div class="report-table-wrap"><table class="report-table"><thead>${learnerHeaders()}</thead><tbody>${learnerRows()}</tbody></table></div></section><div class="report-legend"><strong>Comment lire mon repère ?</strong><p><b>Acquis ici :</b> les 3 activités et la situation nouvelle sont réussies. <b>En cours :</b> des réussites restent à confirmer. <b>À revoir :</b> une difficulté est à retravailler. <b>Non travaillé :</b> pas de réponse évaluée.</p><p>Le bilan décrit cette session, pas une maîtrise définitive. L’entraînement utilise ton dernier essai, même après une aide ou une correction.</p></div><div class="final-actions"><button class="btn primary" type="button" data-print="report">Imprimer mon bilan / PDF</button><button class="btn" type="button" data-nav="reflection">Mon avis argumenté</button><button class="btn" type="button" data-nav="home">R   function buildPrint(){if(!state)return;if(document.body.dataset.printMode==='reflection'){buildOpinionPrint();return;}const s=stats(),score=examScore(),pm=progressMessages();$('print-root').innerHTML=`<section class="print-page"><div class="print-top"><b>TECHNOLOGIE · L’IA : QUI GARDE LA MAIN ?</b><span>MON BILAN</span></div><h1>Je garde la main.</h1><div class="print-identity"><div><b>Nom et prénom</b><span>${esc(state.identity.name||'________________________________')}</span></div><div><b>Classe</b><span>${esc(state.identity.group||'________')}</span></div><div><b>Date</b><span>${dateText(stamp())}</span></div></div><div class="print-result-grid"><div class="print-score"><p>SITUATIONS NOUVELLES</p><strong>${score===null?'—':score}<small> / ${COURSE.exam.length}</small></strong><p>${score===null?'Pas encore réalisées':Math.round(score/COURSE.exam.length*100)+' % de réponses correctes'}</p><p class="print-training"><b>${s.latest}/${allQ.length}</b> réussites à l’entraînement<br>${s.tried}/${allQ.length} activités réalisées</p></div><div class="print-skills"><h2>Compétences : où j’en suis</h2><ul>${skillRows()}</ul></div></div><section class="print-personal"><h2>Mon bilan personnel</h2><div class="learning-grid"><article class="strength-card"><div><h3>★ Mon point fort</h3><p>${esc(pm.strength)}</p></div></article><article class="goal-card"><div><h3>↗ Mon prochain objectif</h3><p>${esc(pm.goal)}</p></div></article></div></section><section class="print-details"><h2>Mes résultats par domaine</h2><table class="report-table"><thead>${learnerHeaders()}</thead><tbody>${learnerRows(true)}</tbody></table></section><div class="print-legend"><p><b>Acquis ici :</b> entraînement et situation nouvelle réussis. <b>En cours :</b> réussites à confirmer. <b>À revoir :</b> difficulté à retravailler. <b>Non travaillé :</b> aucune réponse évaluée.</p><p>L’entraînement compte le dernier essai, y compris après une aide ou une correction. Le bilan décrit cette session, pas une maîtrise dé   document.addEventListener('click',e=>{

    else if(action==='hint'){const a=entry(COURSE.modules[mod].questions[step]);a.hintOpen=!a.hintOpen;if(a.hintOpen)a.hintUsed=true;save();render();$('app').querySelector('[data-action="hint"]')?.focus({preventScroll:true});$('question-title')?.scrollIntoView({block:'nearest'});}

  document.addEventListener('change',e=>{

      if(isExam)state.exam.draft[q.id]=normalizeValue(q,Number(t.value));
      else{const a=entry(q);if(!a.editing)return;if(q.type==='match'){const arr=Array.isArray(a.draft)?[...a.draft]:emptyValue(q);arr[Number(t.dataset.row)]=t.value===''?null:Number(t.value);a.draft=normalizeValue(q,arr);}else if(q.type==='multi'){const v=new Set(a.draft);if(t.checked)v.add(Number(t.value));else v.delete(Number(t.value));a.draft=normalizeValue(q,[...v]);}else a.draft=normalizeValue(q,Number(t.value));}save();

  document.addEventListener('input',e=>{const t=e.target;if(['name','group'].includes(t.dataset.identity)){state.identity[t.dataset.identity]=cut(t.value,t.dataset.identity==='name'?70:18);save();}if(t.dataset.reflection&&t.dataset.reflection!=='decision'){state.reflection[t.dataset.reflection]=cut(t.value);save();}});
  document.addEventListener('submit',e=>{
    if(e.target.id==='training-form'){e.preventDefault();const q=byId.get(e.target.dataset.q),a=entry(q);if(!a.editing)return;if(!filled(q,a.draft)){toast(q.type==='match'?'Complète toutes les associations avant de vérifier.':'Choisis au moins une réponse avant de vérifier.');return;}if(a.records.length>=60){toast('Tu peux relire les corrections ou ouvrir une nouvelle session.');return;}clearTimeout(toastTimer);$('toast').hidden=true;a.records.push({value:clone(a.draft),at:stamp(),support:false,hint:a.hintUsed});a.editing=false;save();render();$('feedback')?.focus({preventScroll:true});$('feedback')?.scrollIntoView({block:'nearest'});}
    if(e.target.id==='exam-form'){e.preventDefault();if(state.exam.submitted)return;const missing=COURSE.exam.find(q=>!filled(q,state.exam.draft[q.id]));if(missing){toast('Réponds aux '+COURSE.exam.length+' situations avant de valider.');$('app').querySelector(`[data-answer="${missing.id}"]`)?.focus();return;}if(!window.confirm('Valider tes réponses ? Elles seront conservées pour cette passation et les corrections apparaîtront.'))return;state.exam.submitted={values:clone(state.exam.draft),at:stamp(),support:false};nav('exam');}
  });
  window.addEventListener('beforeprint',buildPrint);
  window.addEventListener('afterprint',()=>{document.body.dataset.printMode='report';});
  window.addEventListener('beforeunload',e=>{if(stats().tried||state.exam.submitted||Object.values(state.reflection).some(Boolean)){e.preventDefault();e.returnValue='';}});

  window.addEventListener('unload',()=>{disposePlayers();videoURLs.forEach(u=>URL.revokeObjectURL(u));});
  function init(){state=fresh();render();}
  init();
})();</script></body></html>
